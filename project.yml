name: PocketSSH
options:
  bundleIdPrefix: dev.momo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  swift-nio:
    url: https://github.com/apple/swift-nio.git
    from: "2.65.0"
  swift-nio-ssh:
    url: https://github.com/apple/swift-nio-ssh.git
    from: "0.9.0"
  swift-crypto:
    url: https://github.com/apple/swift-crypto.git
    from: "3.0.0"

targets:
  PocketSSH:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: swift-nio
        product: NIOCore
      - package: swift-nio
        product: NIOPosix
      - package: swift-nio-ssh
        product: NIOSSH
      - package: swift-crypto
        product: Crypto
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: PocketSSH
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: PCからこの端末に接続するため、同じWi-Fi内の通信を使用します。
        NSBonjourServices:
          - _pocketssh._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.momo.pocketssh
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
