name: PocketSSH
options:
  bundleIdPrefix: dev.momo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  PocketSSH:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: PocketSSH
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: PCからこの端末に接続するため、同じWi-Fi内の通信を使用します。
        NSBonjourServices:
          - _pocketssh._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.momo.pocketssh
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
